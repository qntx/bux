name: e2e-host

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      # Host-only smoke builds bux-cli (links libkrun). Do not install Go here:
      # FULL=0 does not build bux-shim-bin / libgvproxy.
      # Manual HVF/KVM gate only (CONTRIBUTING.md). Never FULL=1 on GitHub-hosted runners.
      # Seatbelt profile-string tests are Darwin-only and never run on ubuntu CI.
      # Do not cargo test -p bux-shim --lib here: apply.rs calls live create_ctx.
      - name: Jail lib tests (seatbelt profile strings)
        if: runner.os == 'macOS'
        run: cargo test -p bux-jail --lib
      - name: Host-only e2e smoke
        env:
          BUX_E2E_FULL: "0"
        run: ./scripts/e2e/smoke.sh
      - name: Host-only serve smoke
        env:
          BUX_E2E_FULL: "0"
        run: ./scripts/e2e/serve.sh
