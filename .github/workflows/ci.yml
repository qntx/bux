name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: qntx/workflows/.github/workflows/ci-rust.yml@v2
    permissions:
      contents: read
    with:
      rust-version: "1.97.1"
      deny: true

  engine-no-krun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: crates/bux does not depend on bux-krun
        run: |
          set -euo pipefail
          if cargo tree -p bux -i bux-krun --locked; then
            echo "crates/bux must not depend on bux-krun" >&2
            exit 1
          fi
          cargo check -p bux --all-targets --locked
          cargo check -p bux-shim --no-default-features --all-targets --locked

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Installer tests
        run: /bin/sh scripts/install_test.sh
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: actions/setup-go@v7
        with:
          go-version-file: crates/bux-gvproxy/gvproxy-bridge/go.mod
      - uses: Swatinem/rust-cache@v2
      # Guest unit tests (reaper, ca_no_command, sig_ign_waitpid) are cfg(linux).
      # macos-latest has no Go; workspace tests compile bux-gvproxy (libgvproxy).
      # Never BUX_E2E_FULL=1 on GitHub-hosted runners.
      - name: Workspace tests
        run: cargo test --workspace
