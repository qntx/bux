[package]
name = "bux"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
description = "Embedded micro-VM sandbox for running AI agents"
keywords = ["ai", "sandbox", "vm", "kvm"]
categories = ["virtualization", "api-bindings"]

[dependencies]
bux-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
bux-e2fs.workspace = true
bux-jail.workspace = true
bux-oci.workspace = true
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
time = "0.3"
bux-qcow2.workspace = true
bux-shim = { workspace = true, default-features = false }
dirs.workspace = true
flate2.workspace = true
nix.workspace = true
rusqlite.workspace = true
tar.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "rt", "time"] }
ureq.workspace = true

[dev-dependencies]
tempfile.workspace = true
x509-parser = "0.18"

[lints]
workspace = true
