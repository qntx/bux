[package]
name = "bux-gvproxy"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Safe Rust wrapper over gvisor-tap-vsock (gvproxy) — Go CGO bridge packaged as an L1 platform primitive"
