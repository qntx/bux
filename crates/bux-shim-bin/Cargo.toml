[package]
name = "bux-shim-bin"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "bux-shim process: optional in-process gvproxy then libkrun start_enter"
publish = false
keywords = ["vm", "libkrun", "sandbox", "shim"]
categories = ["virtualization", "os"]

[[bin]]
name = "bux-shim"
path = "src/main.rs"

[dependencies]
bux-gvproxy = { workspace = true }
bux-shim = { workspace = true, features = ["krun"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
bux-landlock = { workspace = true }
libc = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
